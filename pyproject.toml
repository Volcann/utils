[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tools-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.3",
    "environment",
    "pr-reviewer",
    "status-reporter",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.uv.workspace]
members = [
    "lazy-reviewer",
    "environment",
    "workedTask",
]

[tool.uv.sources]
environment = { workspace = true }
pr-reviewer = { workspace = true }
status-reporter = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/app.py", "src/tasks"]
