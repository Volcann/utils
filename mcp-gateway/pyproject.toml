[project]
name = "mcp-gateway"
version = "0.1.0"
description = "SSE gateway — aggregates all stdio MCP servers into one endpoint"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
gateway = "gateway.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.uv]
package = true
